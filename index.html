<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>WASIVI</title>
<style>
  :root {
    --black: #15130f;
    --gold-bright: #a89c3e;
    --chrome: #c7c7c2;
    --paper: #f4f2ea;
    --muted: #8c8a80;
    --lightgray: #b8b8b6;
    --silver: #e6e8e9;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--black);
    color: var(--paper);
    font-family: 'Engravers Gothic', 'Copperplate', Garamond, serif;
    line-height: 1.6;
  }
  nav {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 40px;
    padding: 0;
    font-size: 15px;
    letter-spacing: 0.1em;
  }
  nav .menu-item { position: relative; }
  nav a { color: var(--muted); text-decoration: none; }
  nav a.active { color: var(--gold-bright); }
  nav .dropdown {
    display: none;
    position: absolute;
    top: 26px;
    left: 50%;
    transform: translateX(-50%);
    background: #101010;
    border: 1px solid #201f1b;
    padding: 14px 28px;
    white-space: nowrap;
    gap: 28px;
    z-index: 10;
  }
  nav .menu-item:hover .dropdown,
  nav .dropdown.open { display: flex; }
  nav .dropdown a {
    padding: 0;
    font-size: 14px;
    color: var(--muted);
  }
  nav .dropdown a:hover { color: var(--gold-bright); }

  .hero {
    min-height: 92vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 32px 24px 60px;
    border-bottom: 1px solid #2a2a26;
  }
  .mark-placeholder {
    width: 57.375vmin;
    height: 57.375vmin;
    max-width: 742px;
    max-height: 742px;
    border-radius: 50%;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .mark-placeholder video { width: 122%; height: 122%; object-fit: cover; }
  .wordmark {
    margin-top: 32px;
    font-size: 84px;
    letter-spacing: 0.35em;
    text-indent: 0.35em;
    font-weight: 400;
    line-height: 1;
    color: var(--silver);
  }
  .social-row { margin-top: 28px; display: flex; gap: 24px; align-items: center; }
  .social-row a { color: var(--chrome); text-decoration: none; display: flex; }
  .social-row svg { width: 18px; height: 18px; }
  .tagline { margin-top: 20px; color: var(--lightgray); font-size: 18px; letter-spacing: 0.05em; }
</style>
</head>
<body>

<section class="hero">
  <div class="mark-placeholder"><video autoplay loop muted playsinline src="videos/hero.mp4"></video></div>
  <div class="wordmark">WASIVI</div>

  <div class="social-row">

    <a href="#" aria-label="LinkedIn"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.45 20.45h-3.55v-5.57c0-1.33-.02-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.36V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.38-1.85 3.61 0 4.28 2.38 4.28 5.47v6.27zM5.34 7.43a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1 0 4.12zM7.12 20.45H3.56V9h3.56v11.45z"/></svg></a>

    <a href="mailto:wsvdesign@me.com" aria-label="Email"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2.5" y="4.5" width="19" height="15" rx="2"/><path d="M3 6l9 7 9-7"/></svg></a>
  </div>

  <div class="tagline">The medium changed. The thinking never did.</div>

  <nav style="margin-top: 24px;">
    <div class="menu-item"><a href="index.html" class="active">HOME</a></div>
    <div class="menu-item">
      <a href="#" class="companyToggle">COMPANY</a>
      <div class="dropdown companyDropdown">
        <a href="about.html">About</a>
        <a href="how-we-work.html">How We Work</a>
        <a href="faq.html">FAQ</a>
      </div>
    </div>
    <div class="menu-item"><a href="projects.html">PROJECTS</a></div>
    <div class="menu-item"><a href="https://read.wasivi.com">SUBSTACK</a></div>
  </nav>
</section>

<script>
  document.querySelectorAll('.companyToggle').forEach(function(t){
    t.addEventListener('click', function(e){
      e.preventDefault();
      var dd = t.parentElement.querySelector('.companyDropdown');
      dd.classList.toggle('open');
    });
  });
  document.addEventListener('click', function(e){
    document.querySelectorAll('.companyDropdown.open').forEach(function(dd){
      if (!dd.parentElement.contains(e.target)) dd.classList.remove('open');
    });
  });
</script>

</body>
</html>
